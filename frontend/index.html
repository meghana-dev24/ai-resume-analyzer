<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Resume Analyzer 🚀</title>

    <style>
        body {
            font-family: Arial;
            background: #f6f7fb;
            text-align: center;
            padding: 40px;
        }

        .container {
            width: 55%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }

        .upload-btn {
            background: #10b981;
            color: white;
        }

        .analyze-btn {
            background: #2563eb;
            color: white;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
            color: #16a34a;
            margin-top: 20px;
        }

        .tag {
            display: inline-block;
            margin: 4px;
            padding: 5px 10px;
            border-radius: 6px;
            background: #e5e7eb;
        }

        .bad { background: #fee2e2; color: #b91c1c; }
        .good { background: #dcfce7; color: #166534; }

        .section {
            text-align: left;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Resume Analyzer 🚀</h1>

    <!-- FILE UPLOAD -->
    <input type="file" id="file">

    <br><br>

    <!-- BUTTON 1 -->
    <button class="upload-btn" onclick="uploadFile()">
        Upload Resume
    </button>

    <!-- BUTTON 2 -->
    <button class="analyze-btn" onclick="analyzeResume()">
        Analyze Resume
    </button>

    <div id="result"></div>

</div>

<script>

let uploadedFile = null;

/* ---------------- STEP 1: UPLOAD ---------------- */
function uploadFile() {
    const fileInput = document.getElementById("file");

    if (!fileInput.files[0]) {
        alert("Please select a file first");
        return;
    }

    uploadedFile = fileInput.files[0];
    alert("Resume uploaded successfully!");
}

/* ---------------- STEP 2: ANALYZE ---------------- */
async function analyzeResume() {

    if (!uploadedFile) {
        alert("Please upload resume first!");
        return;
    }

    let formData = new FormData();
    formData.append("file", uploadedFile);

    let res = await fetch("http://127.0.0.1:8000/analyze", {
        method: "POST",
        body: formData
    });

    let data = await res.json();

    document.getElementById("result").innerHTML = `
        <div class="score">ATS Score: ${data.ats_score}%</div>

        <div class="section">
            <h3>Skills Found</h3>
            ${data.skills_found.map(s => `<span class="tag good">${s}</span>`).join("")}
        </div>

        <div class="section">
            <h3>Missing Skills</h3>
            ${data.missing_skills.map(s => `<span class="tag bad">${s}</span>`).join("")}
        </div>

        <div class="section">
            <h3>Recommended Jobs</h3>
            ${data.recommended_jobs.map(j => `<span class="tag">${j}</span>`).join("")}
        </div>
    `;
}

</script>

</body>
</html>
